
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Wipacer</title>

    <link rel="stylesheet" href="../Assets/Estilos.css">
</head>

<body>

<main class="login-pagina">

    <section class="login-tarjeta">
        <div class="login-lateral">

            <div class="login-logo">
                WIPACER<span>.</span>
            </div>

            <div class="login-mensaje">
                <h1>Todo tu negocio,<br>
                    <span>en un solo lugar.</span>
                </h1>

                <p>
                    Simplifica tu trabajo, organiza tus procesos
                    y toma mejores decisiones con Wipacer.
                </p>
            </div>

            <div class="login-decoracion">
                ✦ Inteligencia que transforma negocios.
            </div>

        </div>


        <!-- Formulario -->
        <div class="login-contenido">

            <div class="login-encabezado">

                <span class="login-subtitulo">
                    BIENVENIDO DE NUEVO
                </span>

                <h2>Iniciar sesión</h2>

                <p>
                    Ingresa tus datos para continuar.
                </p>

            </div>

            <form id="formLogin"
                  action="../Modelos/IniciarSesion.php"
                  method="POST">

                <div class="login-campo">

                    <label for="Correo">
                        Correo electrónico
                    </label>

                    <input type="email"
                           id="Correo"
                           name="Correo"
                           placeholder="ejemplo@correo.com"
                           required>

                </div>

                <div class="login-campo">

                    <label for="Contrasena">
                        Contraseña
                    </label>

                    <input type="password"
                           id="Contrasena"
                           name="Contrasena"
                           placeholder="Ingrese su contraseña"
                           required>

                </div>

                <button class="login-boton" type="submit">
                    Entrar a Wipacer →
                </button>

                <p id="mensajeLogin" role="status"
                   aria-live="polite"></p>

            </form>

            <div class="login-registro">
                ¿No tienes una cuenta?
                <a href="Registro.html">Crear cuenta</a>
            </div>

        </div>

    </section>

</main>

<script src="../Controladores/Login.js"></script>

</body>
</html>
